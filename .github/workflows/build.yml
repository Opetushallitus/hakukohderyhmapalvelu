name: Hakukohderyhmapalvelu

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: latest

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: 2.11.2

      - uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneLinux: "Europe/Helsinki"

      # Remove following in the future (and update script in package.json), it installs chrome version 116 as the current 117 has bug
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
            chrome-version: 1160321
        id: setup-chrome
      - run: |
          echo Installed chromium version: ${{ steps.setup-chrome.outputs.chrome-version }}
          echo Installed chromium path: ${{ steps.setup-chrome.outputs.chrome-path }}
          which chromium
          chromium --version
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"


      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install
          ./bin/cibuild.sh run-all-tests-and-create-uberjar

      - name: Archive test results
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-snapshots
          path: cypress/screenshots
          retention-days: 4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: restore-build
        with:
          path: target
          key: ${{ github.sha }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: ci-tools
        with:
          path: ci-tools
          key: ${{ github.sha }}

  deploy-container:
    needs: [build]
    uses: Opetushallitus/.github/.github/workflows/push-scan-java-ecr.yml@5b292079aefb2b8baea7d3d8744e969bf18498e7 # main
    with:
      application: hakukohderyhmapalvelu
      base-image: baseimage-fatjar-openjdk21:master
      configfolder: oph-configuration
      jarfile: hakukohderyhmapalvelu
    secrets:
      AWS_UTILITY_ROLE_ARN: ${{ secrets.AWS_OPH_UTILITY_ROLE_ARN }}

  deploy-ovara-container:
    needs: [ build ]
    uses: Opetushallitus/.github/.github/workflows/push-scan-java-ecr.yml@5b292079aefb2b8baea7d3d8744e969bf18498e7 # main
    with:
      application: ovara-hakukohderyhmapalvelu
      base-image: baseimage-fatjar-openjdk21:master
      configfolder: ovara-oph-configuration
      jarfile: ovara-hakukohderyhmapalvelu
    secrets:
      AWS_UTILITY_ROLE_ARN: ${{ secrets.AWS_OPH_UTILITY_ROLE_ARN }}
